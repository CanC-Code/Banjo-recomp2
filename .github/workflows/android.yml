name: Android Build & OTR Verification

on:
  workflow_dispatch:

# Required to allow the GitHub Actions bot to push commits
permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # fetch-depth: 0 is sometimes required depending on your branch protection rules
          fetch-depth: 0 

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: 🖼️ Generate Android Icons
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          if [ ! -f "icon_master.png" ]; then
            convert -size 512x512 xc:blue icon_master.png
          fi
          python3 scripts/generate_icons.py icon_master.png

      - name: 🧹 Pre-Patching (Sanitizer)
        run: python3 scripts/sanitize_codebase.py .

      - name: 🗺️ Generate Asset Manifests
        run: |
          pip3 install pyyaml
          python3 scripts/generate_manifest.py

      # --- NEW COMMIT LOGIC ADDED HERE ---
      - name: 💾 Commit Android-Compatible State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage all modified and new files generated by the scripts
          git add .
          
          # Check if there are staged changes before attempting to commit
          if git diff --staged --quiet; then
            echo "[INFO] No changes detected after running scripts. Skipping commit."
          else
            # [skip ci] prevents this commit from triggering other automated workflows in an infinite loop
            git commit -m "build: overwrite files with Android-compatible state [skip ci]"
            echo "[INFO] Pushing transformed files to the repository..."
            git push
          fi
      # -----------------------------------

      - name: 🐘 Build Verification APK
        run: |
          cd Android
          # Passing EXCLUDE_GAME_SRC to skip the massive /src folder
          gradle assembleDebug \
            -Pandroid.externalNativeBuild.cmake.arguments="-DEXCLUDE_GAME_SRC=ON" \
            --stacktrace

      - name: 📦 Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bka-verification-apk
          path: Android/app/build/outputs/apk/debug/*.apk
