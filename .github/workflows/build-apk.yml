name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "realignment" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@4
        with:
          gradle-version: 8.2

      # CRITICAL FIX: Ensure assets and manifests are packaged before Gradle builds
      - name: 🗂️ Prepare & Package Android Assets
        run: |
          echo "Creating Android assets directory..."
          mkdir -p Android/app/src/main/assets
          
          # 1. Copy the root assets folder if it exists in your repository
          if [ -d "assets" ]; then
            echo "Copying root assets directory..."
            cp -r assets/* Android/app/src/main/assets/ || true
          fi
          
          # 2. If you have a specific script to generate the manifest without a ROM, 
          # you can optionally run it here before the find command.
          # Example: python3 tools/generate_manifest.py 
          
          # 3. Find any .bin manifests that might have been generated or stored elsewhere 
          # in the repository and force them into the Android assets directory so they are bundled.
          find . -type f -name "manifest*.bin" -exec cp {} Android/app/src/main/assets/ \;
          
          echo "Contents of Android/app/src/main/assets/:"
          ls -la Android/app/src/main/assets/

      - name: 🐘 Compile & Build APK
        run: |
          cd Android
          # EXCLUDE_GAME_SRC=OFF includes the core game source for functional testing
          gradle assembleDebug \
            -Pandroid.externalNativeBuild.cmake.arguments="-DEXCLUDE_GAME_SRC=OFF" \
            --stacktrace

      - name: 📦 Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: banjo-kazooie-android-build
          path: Android/app/build/outputs/apk/debug/*.apk